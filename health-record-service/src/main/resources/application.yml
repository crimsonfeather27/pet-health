server:
  port: 8086

spring:
  application:
    name: health-record-service
  data:
    mongodb:
      host: localhost
      port: 27017
      # 统一使用 pethealth_web 库（与 pethealth-web 共享 health_records 集合，
      # 保证 Dubbo 路径与 web 降级本地 Repository 读写同一份数据）
      database: pethealth_web
    redis:
      host: localhost
      port: 6379
      database: 2

dubbo:
  application:
    name: health-record-service
  protocol:
    name: dubbo
    port: 20885
  registry:
    address: N/A
  provider:
    # 仅 AI 诊断会真正用满该时长（DeepSeek 非流式响应最多 60s）；
    # 其余接口 consumer 端各自 timeout=5000，以 consumer 配置为准先超时
    timeout: 65000
    retries: 0
  qos:
    enable: false

llm:
  api-url: ${LLM_API_URL:https://api.deepseek.com/v1/chat/completions}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-v4-flash}
  max-tokens: 4096
  temperature: 0.7

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    com.pethealth: DEBUG

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
        exclude: ""
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
