server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  main:
    allow-circular-references: true
  application:
    name: PetHealth
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    mongodb:
      host: localhost
      port: 27017
      database: pethealth_web
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  llm:
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
  # Dubbo Consumer 开关：true 时优先走 Dubbo 远程调用；false 或调用异常时降级到本地 Repository
  dubbo:
    enabled: ${DUBBO_ENABLED:true}

dubbo:
  application:
    name: pethealth-web
  consumer:
    timeout: 5000
    check: false
    retries: 0
  qos:
    enable: false
  serialize:
    security:
      check:
        serializable: false

mail:
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:465}
  smtp-user: ${SMTP_USER:}
  smtp-password: ${SMTP_PASSWORD:}
  from: ${MAIL_FROM:pethealth@example.com}

reminder:
  scheduler-interval-seconds: 60

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    com.pethealth: DEBUG

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
        exclude: ""
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false  # RabbitMQ 健康检查不参与整体状态（可降级）
  metrics:
    tags:
      application: ${spring.application.name}
